[project]
name = "beams"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.6",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "tqdm>=4.70.1",
    "ultralytics>=8.4.178",
]

[project.scripts]
duckdb-ui = "scripts.duckdb_ui:main"

[tool.uv]
package = true

[tool.setuptools]
packages = ["scripts"]
